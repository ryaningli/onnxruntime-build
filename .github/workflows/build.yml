name: build

on:
  workflow_dispatch:
    inputs:
      ort_ref:
        description: 'ONNX Runtime tag (e.g. v1.28.0) 或 commit hash;须与 ort-sys API 版本对应(v1.28.x↔api-28)'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }} · ${{ inputs.ort_ref }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64: amd64 runner + ubuntu:20.04(amd64) 容器, 原生编译
          - arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          # aarch64: arm64 runner + ubuntu:20.04(arm64) 容器, 原生编译
          # (公开仓库 ARM runner 免费; ubuntu-20.04-arm 原生 runner 不存在, 故用容器)
          - arch: aarch64
            rust_target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 'Build Docker image [${{ inputs.ort_ref }}]'
        run: docker build -t ort-builder .

      - name: 'Build ONNX Runtime ${{ inputs.ort_ref }} (libc++, bundle) + verify [${{ matrix.arch }}]'
        run: |
          mkdir -p out
          docker run --rm \
            -e ORT_REF="${{ inputs.ort_ref }}" \
            -v "$PWD/out:/work/dist" \
            ort-builder \
            bash -c 'set -e; /work/scripts/build_ort.sh "${ORT_REF}"; /work/scripts/verify_abi.sh'

      - name: 'Stage artifact [${{ inputs.ort_ref }} · ${{ matrix.arch }}]'
        run: |
          mv out/onnxruntime-libcxx.tar.gz "out/libonnxruntime-${{ matrix.arch }}-libcxx.tar.gz"
          ls -lh out/

      - name: 'Upload artifact [${{ matrix.arch }}]'
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-libcxx-${{ matrix.arch }}
          path: out/libonnxruntime-${{ matrix.arch }}-libcxx.tar.gz
          if-no-files-found: error

  release:
    name: 'Publish release · ${{ inputs.ort_ref }}'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 'Download all arch artifacts [${{ inputs.ort_ref }}]'
        uses: actions/download-artifact@v4
        with:
          pattern: onnxruntime-libcxx-*
          path: assets
          merge-multiple: true

      - name: 'Generate checksums [${{ inputs.ort_ref }}]'
        run: |
          cd assets
          sha256sum *.tar.gz > sha256sums.txt
          ls -lh

      - name: 'Create GitHub Release [${{ inputs.ort_ref }}]'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.ort_ref }}-libcxx
          name: ONNX Runtime ${{ inputs.ort_ref }} (libc++, glibc 2.31)
          make_latest: false
          body: |
            ONNX Runtime 静态库, **libc++ ABI**, 基于 Ubuntu 20.04 (glibc 2.31)。
            供 `cargo zigbuild --target <triple>.2.31` 链接使用。

            每个 arch 打包成单个 `.tar.gz`(内含 `libonnxruntime.a`)。

            ## Assets
            - `libonnxruntime-x86_64-libcxx.tar.gz`
            - `libonnxruntime-aarch64-libcxx.tar.gz`
            - `sha256sums.txt`

            ## 用法
            见仓库 README「本地消费」一节(解压 tar.gz + 三个环境变量 + zigbuild 命令)。

            ## 对应关系
            ref 必须与 ort-sys API 版本对应:v1.28.x ↔ api-28, v1.27.x ↔ api-27。
          files: assets/*.tar.gz
