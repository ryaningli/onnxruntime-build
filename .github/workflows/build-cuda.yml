name: build-cuda

on:
  workflow_dispatch:
    inputs:
      ort_ref:
        description: 'ONNX Runtime tag (e.g. v1.28.0) 或 commit hash;须与 ort-sys API 版本对应(v1.28.x↔api-28)'
        required: true
      cuda_version:
        description: 'CUDA 版本: 13 (ubuntu22.04 / glibc 2.35)。当前工具链(clang-21 + CUDA13)仅支持 13。'
        required: true
        default: '13'
      fast:
        description: '快速验证模式:只编单个 CUDA arch(75)、不发 Release。用于迭代调试构建是否走通。'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build-cuda:
    name: x86_64 · CUDA ${{ inputs.cuda_version }} · ${{ inputs.ort_ref }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Resolve CUDA base image [${{ inputs.ort_ref }} · CUDA ${{ inputs.cuda_version }}]'
        id: base
        run: |
          case "${{ inputs.cuda_version }}" in
            13) echo "image=nvidia/cuda:13.0.3-cudnn-devel-ubuntu22.04" >> "$GITHUB_OUTPUT" ;;
            *)  echo "ERROR: unsupported cuda_version '${{ inputs.cuda_version }}' —— 当前工具链(clang-21)仅支持 13" >&2; exit 1 ;;
          esac

      - uses: docker/setup-buildx-action@v3
      - name: 'Build Docker image [${{ inputs.ort_ref }} · CUDA ${{ inputs.cuda_version }}]'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cuda
          load: true
          tags: ort-builder-cuda
          build-args: CUDA_BASE=${{ steps.base.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 'Build ONNX Runtime ${{ inputs.ort_ref }} (CUDA ${{ inputs.cuda_version }}, libstdc++) + verify'
        run: |
          mkdir -p out
          # fast 模式只编单 CUDA arch 验证构建是否走通(空时不向 docker 注入空参数)。
          FAST_FLAG=""
          if [ "${{ inputs.fast }}" = "true" ]; then FAST_FLAG="-e ORT_FAST=1"; fi
          docker run --rm \
            -e ORT_REF="${{ inputs.ort_ref }}" \
            -e ORT_ENABLE_CUDA=1 \
            $FAST_FLAG \
            -v "$PWD/out:/work/dist" \
            ort-builder-cuda \
            bash -c 'set -e; /work/scripts/build_ort.sh "${ORT_REF}"; /work/scripts/verify_abi.sh'

      - name: 'Stage artifact [${{ inputs.ort_ref }} · CUDA ${{ inputs.cuda_version }}]'
        run: |
          mv out/onnxruntime-libcxx.tar.gz "out/libonnxruntime-x86_64-cuda${{ inputs.cuda_version }}.tar.gz"
          ls -lh out/

      - name: 'Upload artifact'
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-cuda${{ inputs.cuda_version }}
          path: out/libonnxruntime-x86_64-cuda${{ inputs.cuda_version }}.tar.gz
          if-no-files-found: error

  release:
    name: 'Publish release · ${{ inputs.ort_ref }} · CUDA ${{ inputs.cuda_version }}'
    if: ${{ inputs.fast != true }}
    needs: build-cuda
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 'Download artifact [${{ inputs.ort_ref }} · CUDA ${{ inputs.cuda_version }}]'
        uses: actions/download-artifact@v4
        with:
          name: onnxruntime-cuda${{ inputs.cuda_version }}
          path: assets

      - name: 'Generate checksums [${{ inputs.ort_ref }} · CUDA ${{ inputs.cuda_version }}]'
        run: |
          cd assets
          sha256sum *.tar.gz > sha256sums.txt
          ls -lh

      - name: 'Create GitHub Release [${{ inputs.ort_ref }} · CUDA ${{ inputs.cuda_version }}]'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.ort_ref }}-cuda${{ inputs.cuda_version }}
          name: ONNX Runtime ${{ inputs.ort_ref }} (CUDA ${{ inputs.cuda_version }}, libstdc++, glibc 2.35)
          make_latest: false
          body: |
            ONNX Runtime + CUDA EP, **libstdc++ ABI**, 基于 Ubuntu 22.04 (jammy, glibc 2.35)。

            为什么是 libstdc++ 而非 libc++:CUDA 的 `host_defines.h` 在 x86 上对 libc++ 直接 `#error`
            ("libc++ is not supported on x86 system"),故 CUDA 无法走 libc++。CPU 版才用 libc++。

            产物(`.tar.gz` 内):
            - `libonnxruntime.a` —— 静态核心(libstdc++;仅 cargo build 系统链接器可静态链,zig 不行)
            - `libonnxruntime.so`(+ 版本符号链接)—— 共享核心,load-dynamic 入口
            - `libonnxruntime_providers_shared.so` / `libonnxruntime_providers_cuda.so` —— CUDA 内核(MODULE)

            ⚠️ CUDA EP 上游恒为运行时加载的 MODULE 共享库,无法静态编进单个 `.a`。
            消费端走 ort **load-dynamic**(zigbuild 只编 Rust、运行时 dlopen `libonnxruntime.so`,
            不链接 ORT 的 C++,故 libstdc++ 不影响 zigbuild)。宿主须装对应 CUDA 运行库(cudart/cublas/cudnn,
            匹配 CUDA 13)+ glibc ≥ 2.35。详见仓库 README「CUDA 消费」。

            ## Assets
            - `libonnxruntime-x86_64-cuda${{ inputs.cuda_version }}.tar.gz`
            - `sha256sums.txt`

            ## 对应关系
            ref 必须与 ort-sys API 版本对应:v1.28.x ↔ api-28, v1.27.x ↔ api-27。
          files: assets/*.tar.gz
