name: build-cuda

on:
  workflow_dispatch:
    inputs:
      ort_ref:
        description: 'ONNX Runtime tag (e.g. v1.28.0) 或 commit hash;须与 ort-sys API 版本对应(v1.28.x↔api-28)'
        required: true
      cuda_version:
        description: 'CUDA 版本: 12.8 (ubuntu20.04/glibc2.31) 或 13 (ubuntu22.04/glibc2.35)'
        required: true
        default: '12.8'
      fast:
        description: '快速验证模式:只编单个 CUDA arch(75)、不发 Release。用于迭代调试构建是否走通。'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build-cuda:
    name: x86_64 · CUDA ${{ inputs.cuda_version }} · ${{ inputs.ort_ref }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Resolve CUDA base image [${{ inputs.ort_ref }} · CUDA ${{ inputs.cuda_version }}]'
        id: base
        run: |
          case "${{ inputs.cuda_version }}" in
            12.8) echo "image=nvidia/cuda:12.8.1-cudnn-devel-ubuntu20.04" >> "$GITHUB_OUTPUT" ;;
            13)   echo "image=nvidia/cuda:13.0.3-cudnn-devel-ubuntu22.04"  >> "$GITHUB_OUTPUT" ;;
            *)    echo "ERROR: unsupported cuda_version '${{ inputs.cuda_version }}' (12.8 | 13)" >&2; exit 1 ;;
          esac

      - name: 'Build Docker image [${{ inputs.ort_ref }} · CUDA ${{ inputs.cuda_version }}]'
        run: docker build -f Dockerfile.cuda --build-arg CUDA_BASE=${{ steps.base.outputs.image }} -t ort-builder-cuda .

      - name: 'Build ONNX Runtime ${{ inputs.ort_ref }} (CUDA ${{ inputs.cuda_version }}, libc++) + verify'
        run: |
          mkdir -p out
          # fast 模式只编单 CUDA arch 验证构建是否走通(空时不向 docker 注入空参数)。
          FAST_FLAG=""
          if [ "${{ inputs.fast }}" = "true" ]; then FAST_FLAG="-e ORT_FAST=1"; fi
          docker run --rm \
            -e ORT_REF="${{ inputs.ort_ref }}" \
            -e ORT_ENABLE_CUDA=1 \
            $FAST_FLAG \
            -v "$PWD/out:/work/dist" \
            ort-builder-cuda \
            bash -c 'set -e; /work/scripts/build_ort.sh "${ORT_REF}"; /work/scripts/verify_abi.sh'

      - name: 'Stage artifact [${{ inputs.ort_ref }} · CUDA ${{ inputs.cuda_version }}]'
        run: |
          mv out/onnxruntime-libcxx.tar.gz "out/libonnxruntime-x86_64-libcxx-cuda${{ inputs.cuda_version }}.tar.gz"
          ls -lh out/

      - name: 'Upload artifact'
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-libcxx-cuda${{ inputs.cuda_version }}
          path: out/libonnxruntime-x86_64-libcxx-cuda${{ inputs.cuda_version }}.tar.gz
          if-no-files-found: error

  release:
    name: 'Publish release · ${{ inputs.ort_ref }} · CUDA ${{ inputs.cuda_version }}'
    if: ${{ inputs.fast != true }}
    needs: build-cuda
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 'Download artifact [${{ inputs.ort_ref }} · CUDA ${{ inputs.cuda_version }}]'
        uses: actions/download-artifact@v4
        with:
          name: onnxruntime-libcxx-cuda${{ inputs.cuda_version }}
          path: assets

      - name: 'Generate checksums [${{ inputs.ort_ref }} · CUDA ${{ inputs.cuda_version }}]'
        run: |
          cd assets
          sha256sum *.tar.gz > sha256sums.txt
          ls -lh

      - name: 'Create GitHub Release [${{ inputs.ort_ref }} · CUDA ${{ inputs.cuda_version }}]'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.ort_ref }}-libcxx-cuda${{ inputs.cuda_version }}
          name: ONNX Runtime ${{ inputs.ort_ref }} (libc++, CUDA ${{ inputs.cuda_version }})
          make_latest: false
          body: |
            ONNX Runtime 静态库 + CUDA EP, **libc++ ABI**。

            产物(`.tar.gz` 内):
            - `libonnxruntime.a` —— 核心 + CUDA EP 注册符号(libc++)
            - `libonnxruntime_providers_shared.so` / `libonnxruntime_providers_cuda.so` —— CUDA 内核(libc++, rpath=$ORIGIN)
            - `libc++.so.1` / `libc++abi.so.1` —— 随包 libc++ 运行库

            ⚠️ CUDA EP 上游恒为运行时加载的 MODULE 共享库,无法静态编进 `.a`。
            消费端须:把 provider `.so` 放到运行时可发现处(见 README「CUDA 消费」),宿主须装对应
            CUDA 运行库(cudart/cublas/cudnn)。详见仓库 README。

            ## Assets
            - `libonnxruntime-x86_64-libcxx-cuda${{ inputs.cuda_version }}.tar.gz`
            - `sha256sums.txt`

            ## 对应关系
            ref 必须与 ort-sys API 版本对应:v1.28.x ↔ api-28, v1.27.x ↔ api-27。
          files: assets/*.tar.gz
